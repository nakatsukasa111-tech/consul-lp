<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 750" width="1000" height="750" role="img" aria-label="閉店後の店内（写真プレースホルダー）">
  <rect width="1000" height="750" fill="#F1EADE"/>
  <rect x="22" y="22" width="956" height="706" fill="none"
        stroke="#D9673A" stroke-width="2" stroke-dasharray="10 8" opacity=".42"/>
  <text x="500" y="285" text-anchor="middle" fill="#3D372F"
        font-family="system-ui, sans-serif" font-size="45" font-weight="700">閉店後の店内</text>
  <text x="500" y="361" text-anchor="middle" fill="#8A8073" font-family="system-ui, sans-serif" font-size="31">営業後、一人でPCに向かう店長の後ろ姿。</text>
  <text x="500" y="414" text-anchor="middle" fill="#8A8073" font-family="system-ui, sans-serif" font-size="31">孤独感ではなく「集中」の空気で。</text>
  <text x="500" y="702" text-anchor="middle" fill="#D9673A"
        font-family="system-ui, sans-serif" font-size="25" font-weight="700" letter-spacing="1.5">推奨 4:3</text>
</svg>