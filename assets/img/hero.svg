<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="メインビジュアル（写真プレースホルダー）">
  <rect width="1600" height="900" fill="#F1EADE"/>
  <rect x="27" y="27" width="1546" height="846" fill="none"
        stroke="#D9673A" stroke-width="2" stroke-dasharray="10 8" opacity=".42"/>
  <text x="800" y="265" text-anchor="middle" fill="#3D372F"
        font-family="system-ui, sans-serif" font-size="72" font-weight="700">メインビジュアル</text>
  <text x="800" y="388" text-anchor="middle" fill="#8A8073" font-family="system-ui, sans-serif" font-size="50">中務さんが自分の店舗に立っている写真。</text>
  <text x="800" y="473" text-anchor="middle" fill="#8A8073" font-family="system-ui, sans-serif" font-size="50">スタッフと話している場面が理想。</text>
  <text x="800" y="558" text-anchor="middle" fill="#8A8073" font-family="system-ui, sans-serif" font-size="50">自然光の入る明るい店内で、横位置。</text>
  <text x="800" y="841" text-anchor="middle" fill="#D9673A"
        font-family="system-ui, sans-serif" font-size="40" font-weight="700" letter-spacing="1.5">推奨 16:9</text>
</svg>